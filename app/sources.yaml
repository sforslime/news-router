# Source registry for the news router.
#
# Every outlet is read from what it already publishes openly: its WordPress
# REST endpoint (/wp-json/wp/v2) where that is reachable, its RSS feed where it
# is not. wp-json is preferred because it can be paged back through a whole
# day; a feed only holds the latest handful of items.
#
# `enabled: false` means the router knows about the outlet but cannot read it.
#
# `full_text: false` stops the .md export fetching an outlet's full text; its
# reports then carry headline, summary and link only. On by default, and only
# WordPress outlets can be fetched this way.
#
# WordPress probes 2026-08-21 and 2026-10-05; feed probes 2026-08-27 and 2026-10-05.

sources:
  - id: premium-times
    name: Premium Times
    homepage: https://www.premiumtimesng.com
    adapter: wordpress
    endpoint: https://www.premiumtimesng.com/wp-json/wp/v2
    enabled: true
    attribution_name: Premium Times
    timezone: Africa/Lagos

