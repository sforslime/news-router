# Source registry for the news router.
#
# Every outlet is read from what it already publishes openly: its WordPress
# REST endpoint (/wp-json/wp/v2) where that is reachable, its RSS feed where it
# is not. wp-json is preferred because it can be paged back through a whole
# day; a feed only holds the latest handful of items.
#
# `enabled: false` means the router knows about the outlet but cannot read it.
#
# WordPress probes 2026-08-21 and 2026-10-05; feed probes 2026-08-27.

sources:
  - id: premium-times
    name: Premium Times
    homepage: https://www.premiumtimesng.com
    adapter: wordpress
    endpoint: https://www.premiumtimesng.com/wp-json/wp/v2
    enabled: true
    attribution_name: Premium Times
    timezone: Africa/Lagos

  - id: icir
    name: The ICIR
    homepage: https://www.icirnigeria.org
    adapter: wordpress
    endpoint: https://www.icirnigeria.org/wp-json/wp/v2
    enabled: true
    attribution_name: The International Centre for Investigative Reporting

  - id: ripples
    name: Ripples Nigeria
    homepage: https://ripplesnigeria.com
    adapter: wordpress
    endpoint: https://ripplesnigeria.com/wp-json/wp/v2
    enabled: true
    attribution_name: Ripples Nigeria
    timezone: Africa/Lagos

  - id: punch
    name: Punch
    homepage: https://punchng.com
    adapter: wordpress
    endpoint: https://punchng.com/wp-json/wp/v2
    enabled: true
    attribution_name: Punch

  - id: leadership
    name: Leadership
    homepage: https://leadership.ng
    adapter: wordpress
    endpoint: https://leadership.ng/wp-json/wp/v2
    enabled: true
    attribution_name: Leadership

  - id: peoples-gazette
    name: Peoples Gazette
    homepage: https://gazettengr.com
    adapter: wordpress
    endpoint: https://gazettengr.com/wp-json/wp/v2
    enabled: true
    attribution_name: Peoples Gazette

  - id: daily-trust
    name: Daily Trust
    homepage: https://dailytrust.com
    adapter: wordpress
    endpoint: https://dailytrust.com/wp-json/wp/v2
    enabled: true
    attribution_name: Daily Trust

  - id: nairametrics
    name: Nairametrics
    homepage: https://nairametrics.com
    adapter: wordpress
    endpoint: https://nairametrics.com/wp-json/wp/v2
    enabled: true
    attribution_name: Nairametrics

  - id: tribune
    name: Nigerian Tribune
    homepage: https://tribuneonlineng.com
    adapter: wordpress
    endpoint: https://tribuneonlineng.com/wp-json/wp/v2
    enabled: true
    attribution_name: Nigerian Tribune

  # wp-json Cloudflare-blocked (403); read from the feed.
  - id: vanguard
    name: Vanguard
    homepage: https://www.vanguardngr.com
    adapter: rss
    endpoint: https://www.vanguardngr.com/feed/
    enabled: true
    attribution_name: Vanguard

  # Cloudflare-blocked on both probes: wp-json 403 (2026-08-21) and /feed/ 403
  # (2026-08-27). Off until one of them opens.
  - id: thecable
    name: TheCable
    homepage: https://www.thecable.ng
    adapter: wordpress
    endpoint: https://www.thecable.ng/wp-json/wp/v2
    enabled: false
    attribution_name: TheCable
