# Source registry for the news router.
#
# `enabled: false` means the router knows about the outlet but will not ingest it.
# Nothing gets ingested before there is permission — an open /wp-json endpoint is
# not permission. The tier 4 RSS lane is the one exception by design: a public
# feed is published specifically to be read by aggregators, so RSS sources run
# with every rights flag off — headline, link and attribution, nothing more.
# Moving an RSS outlet up a tier still requires an agreement.
#
# WordPress probe results recorded 2026-08-21; feed probes 2026-08-27.
#
# Where each agreement stands is deliberately not recorded here. It lives in
# sources.local.yaml, which is git-ignored; see sources.local.example.yaml.

sources:
  - id: premium-times
    name: Premium Times
    homepage: https://www.premiumtimesng.com
    tier: 2
    adapter: wordpress
    endpoint: https://www.premiumtimesng.com/wp-json/wp/v2
    enabled: true
    rights_dek: true
    rights_snippet: true
    rights_image: true
    attribution_name: Premium Times
    timezone: Africa/Lagos

  - id: icir
    name: The ICIR
    homepage: https://www.icirnigeria.org
    tier: 2
    adapter: wordpress
    endpoint: https://www.icirnigeria.org/wp-json/wp/v2
    enabled: true
    rights_dek: true
    rights_snippet: true
    rights_image: true
    attribution_name: The International Centre for Investigative Reporting

  - id: ripples
